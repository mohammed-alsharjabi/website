    .btn{display:inline-flex; align-items:center; gap:8px; padding:10px 14px; border:1px solid var(--line); background:linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.03)); border-radius:12px; font-weight:800}
    .lang-toggle{padding:8px 12px; border-radius:10px; border:1px solid var(--line); background:var(--glass); cursor:pointer; color:#dff3ef; font-weight:800}

    .hero{position:relative; padding: 34px var(--pad) 20px; background: radial-gradient(700px 320px at 80% 0%, rgba(88,255,233,.06), transparent)}
    .hero h1{margin:0; font-size:var(--h1); line-height:1.1; font-weight:900; background:linear-gradient(180deg, #dffbf6, #44c7b2); -webkit-background-clip:text; background-clip:text; color:transparent}
    .hero .sub{margin:8px 0 0; color:var(--muted)}
    .filters{margin-top:14px; display:flex; flex-wrap:wrap; gap:8px}
    .chip{font-size:var(--small); padding:6px 10px; border-radius:999px; border:1px solid var(--line); background:var(--glass); cursor:pointer}
    .chip.active{background:rgba(15,176,153,.18)}

    /* Grid */
    .wrap{padding: var(--pad)}
    .grid{display:grid; grid-template-columns:1fr; gap:18px}
    @media (min-width:860px){ .grid{grid-template-columns:repeat(3,1fr)} }
    .card{position:relative; border:1px solid var(--line); border-radius:18px; overflow:hidden; background:linear-gradient(180deg, rgba(255,255,255,.07), rgba(255,255,255,.03)); box-shadow:0 18px 45px rgba(0,0,0,.35); transform: translateY(18px) scale(.98); opacity:0; transition: transform .25s ease, box-shadow .25s ease}
    .card:hover{transform:translateY(0) scale(1); box-shadow:0 30px 70px rgba(0,0,0,.55)}
    .shot{aspect-ratio:16/10; background: radial-gradient(600px 280px at 70% 20%, rgba(15,176,153,.25), transparent), linear-gradient(180deg, #07101a, #0e1926)}
    .meta{padding:12px 14px; display:flex; align-items:center; justify-content:space-between; gap:10px}
    .tag{font-size:var(--small); padding:6px 10px; border-radius:999px; border:1px solid var(--line); background:var(--glass)}

    /* Detail View */
    .hidden{display:none !important}
    .detail{padding: var(--pad); display:grid; gap:18px}
    .crumbs{font-size:var(--small); color:#cdebe6}
    .hero-shot{border:1px solid var(--line); border-radius:18px; overflow:hidden; background:linear-gradient(120deg,#0f172a,#0b1220); aspect-ratio:21/9; box-shadow:0 18px 45px rgba(0,0,0,.35)}
    .detail-head{display:grid; gap:10px}
    @media (min-width:980px){ .detail-head{grid-template-columns:1.2fr .8fr} }
    .hgroup h2{margin:0; font-size:var(--h2); font-weight:900}
    .hgroup p{margin:6px 0 0; color:var(--muted)}
    .facts{display:grid; grid-template-columns:repeat(2,1fr); gap:10px}

    .fact{background:var(--glass); border:1px solid var(--line); border-radius:14px; padding:12px}

    .tabs{display:flex; flex-wrap:wrap; gap:8px; margin-top:4px}
    .tab{padding:8px 12px; border-radius:10px; border:1px solid var(--line); background:var(--glass); cursor:pointer}
    .tab.active{background:rgba(15,176,153,.18)}
    .panels{margin-top:12px}
    .panel{display:none; border:1px solid var(--line); background:var(--card); border-radius:14px; padding:14px}
    .panel.active{display:block}

    .two-col{display:grid; grid-template-columns:1fr; gap:12px}
    @media (min-width:980px){ .two-col{grid-template-columns:1fr 1fr} }

    .gallery{display:grid; grid-template-columns:1fr 1fr; gap:10px}

    footer{padding: 26px var(--pad) 40px; color:#a5c7c1; border-top:1px solid rgba(255,255,255,.08)}

    .wa{ position:fixed; inset-inline-start:18px; inset-block-end:18px; z-index:120 }
    .wa a{ position:relative; display:grid; place-items:center; width:54px; height:54px; border-radius:50%; background:#25D366; color:#fff; box-shadow:0 14px 35px rgba(0,0,0,.35) }
    .wa a::after{ content:""; position:absolute; inset:-10px; border-radius:50%; border:2px solid rgba(37,211,102,.3); animation:pulse 1.8s infinite ease-out }
    @keyframes pulse{ 0%{ transform:scale(.9); opacity:1 } 100%{ transform:scale(1.2); opacity:0 } }

    noscript .card{opacity:1 !important; transform:none !important}
  </style>
</head>

  function drawGrid(tag=null){ grid.innerHTML = PROJECTS.filter(p=>!tag||p.tag===tag).map(cardHTML).join(''); gsap.utils.toArray('.card').forEach((c,i)=>{ gsap.to(c,{y:0,scale:1,opacity:1,duration:.6,delay:i*0.05,ease:'power2.out'}); c.addEventListener('click',()=>{ location.hash = `#/p/${c.dataset.id}`; });}); }

  // ====== Detail ======
  const detail = {
    wrap: el('#detailView'), hero: el('#detailHero'), title: el('#detailTitle'), sum: el('#detailSummary'), breadcrumbs: el('#crumbTitle'), badges: el('#techBadges'),
    facts: {client:el('#fClient'), year:el('#fYear'), duration:el('#fDuration'), scope:el('#fScope')},
    tabs: el('#tabs'), panels: { overview:el('#panel-overview'), features:el('#panel-features'), gallery:el('#panel-gallery'), links:el('#panel-links') }
  };
  const TAB_KEYS = ['overview','features','gallery','links'];
  function techBadge(key){ return `<span class="badge">${ICONS[key]||''}<span>${key.toUpperCase()}</span></span>`; }
  function drawDetail(id){
    const p = byId(id); if(!p){ location.hash = '#/'; return; }
    el('#listView').classList.add('hidden'); detail.wrap.classList.remove('hidden'); window.scrollTo({top:0,behavior:'smooth'});
    detail.hero.style.background = `radial-gradient(700px 260px at 70% 20%, rgba(15,176,153,.25), transparent), linear-gradient(120deg, ${p.cover})`;
    detail.title.textContent = p.title[lang]; detail.sum.textContent = p.summary[lang]; detail.breadcrumbs.textContent = p.title[lang];
    detail.facts.client.textContent = p.client; detail.facts.year.textContent = p.year; detail.facts.duration.textContent = p.duration; detail.facts.scope.textContent = p.scope;
    detail.badges.innerHTML = p.tech.map(techBadge).join('');

    // Tabs
    const labels = UI[lang].tabs; detail.tabs.innerHTML = labels.map((t,i)=>`<button class='tab ${i?"":"active"}' data-k='${TAB_KEYS[i]}'>${t}</button>`).join('');
    els('.tab', detail.tabs).forEach(btn=>btn.addEventListener('click',()=>activateTab(btn.dataset.k)));

    // Panels
    detail.panels.overview.innerHTML = `<div class='two-col'>
      <div><h3 style='margin:0 0 6px'>${labels[0]}</h3><p style='color:var(--muted)'>${p.overview[lang]}</p>
        <div style='display:flex; flex-wrap:wrap; gap:8px; margin-top:8px'>${(p.results||[]).map(r=>`<span class='badge'><strong>${r.k}</strong>&nbsp;${r.v}</span>`).join('')}</div>
      </div>
      <div class='gallery'>${Array.from({length:p.gallery||4}).map(()=>`<div class='shot-sm'></div>`).join('')}</div>
    </div>
    <div style='margin-top:10px; display:flex; gap:8px; flex-wrap:wrap'>
      <a class='btn' href='https://wa.me/${WA_NUMBER}?text=${encodeURIComponent('أرغب بمشروع مشابه: '+p.title[lang])}' target='_blank' rel='noopener'>${UI[lang].cta.discuss} 🔗</a>
    </div>`;

    detail.panels.features.innerHTML = `<ul style='margin:0; padding:0; display:grid; gap:10px'>${p.features[lang].map(f=>`<li style='list-style:none; display:flex; gap:10px'><span style='width:10px; height:10px; border-radius:50%; background:var(--brand); box-shadow:0 0 0 6px rgba(15,176,153,.16)'></span><span>${f}</span></li>`).join('')}</ul>`;

    detail.panels.gallery.innerHTML = `<div class='gallery'>${Array.from({length:p.gallery||6}).map(()=>`<div class='shot-sm'></div>`).join('')}</div>`;

    detail.panels.links.innerHTML = (p.links||[]).map(l=>`<p><a class='btn' href='${l.href}' target='_blank' rel='noopener'>${l.label} ↗</a></p>`).join('') || `<p style='color:var(--muted)'>—</p>`;

    activateTab('overview');
  }
  function activateTab(k){ els('.tab', detail.tabs).forEach(b=>b.classList.toggle('active', b.dataset.k===k)); Object.entries(detail.panels).forEach(([key,p])=>p.classList.toggle('active', key===k)); }

  function drawList(){ el('#detailView').classList.add('hidden'); el('#listView').classList.remove('hidden'); drawGrid(); }

  function router(){
    const h = hash();
    if(!h || h==='/' || h==='/projects'){ drawList(); return; }
    const m = h.match(/^\/p\/(.+)$/); if(m){ drawDetail(m[1]); return; }
    drawList();
  }

  // ====== Init ======
  document.getElementById('y').textContent = new Date().getFullYear();
  document.getElementById('langToggle').addEventListener('click',()=> setLang(lang==='ar'?'en':'ar'));
  setLang('ar');
  drawFilters();
  drawGrid();
  window.addEventListener('hashchange', router);
  router();

  // Reveal animation for cards
  if(window.gsap){ gsap.utils.toArray('.card').forEach((c,i)=> gsap.to(c,{y:0,scale:1,opacity:1,duration:.6,delay:i*0.05,ease:'power2.out'})); }
  </script>
</body>
</html>
